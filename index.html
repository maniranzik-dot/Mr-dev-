<!-- QUIZ SECTION -->
<div class="card">

<h2>📝 Quiz Test</h2>

<h3 id="quizQuestion">HTML ikoreshwa iki?</h3>

<button onclick="answer(0)" id="a1">
A. Gukora website
</button>

<br><br>

<button onclick="answer(1)" id="a2">
B. Gukina umupira
</button>


<h3 id="quizResult">Score: 0</h3>

<button onclick="nextQuestion()">
Next Question ➡️
</button>

</div>


<script>

let quiz=[
{
q:"HTML ikoreshwa iki?",
a:["A. Gukora website","B. Gukina umupira"],
correct:0
},

{
q:"CSS ikoreshwa iki?",
a:["A. Gushushanya website","B. Gukora telephone"],
correct:0
},

{
q:"JavaScript ikora iki?",
a:["A. Kongera imikorere ya website","B. Guhindura computer"],
correct:0
}
];


let number=0;
let score=0;


function showQuiz(){

document.getElementById("quizQuestion").innerHTML=
quiz[number].q;

document.getElementById("a1").innerHTML=
quiz[number].a[0];

document.getElementById("a2").innerHTML=
quiz[number].a[1];

}


function answer(x){

if(x==quiz[number].correct){

score++;

alert("Correct ✅");

}else{

alert("Wrong ❌");

}

document.getElementById("quizResult").innerHTML=
"Score: "+score;

}


function nextQuestion(){

number++;

if(number>=quiz.length){

alert("Quiz Finished 🎉 Score: "+score);

number=0;
score=0;

}

showQuiz();

}


showQuiz();

</script>
