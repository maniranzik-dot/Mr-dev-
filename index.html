<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr-dev Learning Hub</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071426;
  color:white;
}

header{
  background:#102b48;
  padding:25px 15px;
  text-align:center;
  border-bottom:2px solid #234b75;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.logo span{
  color:#20df70;
}

nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:20px;
}

nav button{
  background:#123453;
  color:white;
  border:2px solid #234b75;
  padding:15px 25px;
  border-radius:15px;
  font-size:18px;
  cursor:pointer;
}

nav button:hover{
  background:#20df70;
  color:#071426;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 20px;
}

.intro{
  text-align:center;
  font-size:24px;
  line-height:1.6;
  color:#b9c9dc;
}

.search-box{
  margin:30px 0;
}

.search-box input{
  width:100%;
  padding:18px;
  border-radius:12px;
  border:2px solid #234b75;
  background:#123453;
  color:white;
  font-size:17px;
  outline:none;
}

.search-box button{
  width:100%;
  margin-top:10px;
  padding:17px;
  border:0;
  border-radius:12px;
  background:#20df70;
  color:#071426;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

h2{
  font-size:32px;
  margin-top:40px;
}

.class-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.class-btn{
  padding:20px;
  background:#123453;
  border:2px solid #234b75;
  border-radius:18px;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.class-btn.active{
  background:#20df70;
  color:#071426;
}

.subjects{
  margin-top:30px;
}

.subject{
  background:#123453;
  border:2px solid #234b75;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
  cursor:pointer;
  font-size:20px;
}

.subject:hover{
  border-color:#20df70;
}

.topics{
  display:none;
  margin-top:20px;
}

.topic{
  background:#123453;
  border:3px solid #20df70;
  border-radius:22px;
  padding:25px;
  margin:18px 0;
  cursor:pointer;
  transition:.2s;
}

.topic:hover{
  transform:scale(1.01);
  background:#194567;
}

.topic h3{
  color:#20df70;
  font-size:27px;
  margin:0 0 20px;
}

.topic p{
  font-size:19px;
  line-height:1.5;
}

.notes-page{
  min-height:100vh;
  padding:25px 20px;
  background:#071426;
}

.back{
  background:#20df70;
  color:#071426;
  border:0;
  padding:14px 20px;
  border-radius:12px;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

.notes{
  max-width:850px;
  margin:25px auto;
  background:#123453;
  border:2px solid #20df70;
  border-radius:20px;
  padding:25px;
}

.notes h1{
  color:#20df70;
}

.notes h2{
  color:#20df70;
  font-size:25px;
}

.notes p,
.notes li{
  font-size:18px;
  line-height:1.7;
}

.formula{
  background:#071426;
  border-left:5px solid #20df70;
  padding:15px;
  margin:15px 0;
  font-size:20px;
}

footer{
  text-align:center;
  padding:35px 15px;
  margin-top:50px;
  border-top:2px solid #234b75;
  color:#b9c9dc;
}

@media(max-width:600px){
  .class-buttons{
    grid-template-columns:1fr;
  }

  .logo{
    font-size:27px;
  }

  .intro{
    font-size:20px;
  }

  .topic h3{
    font-size:23px;
  }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="logo">📚 <span>Mr-dev</span> Learning Hub</div>

  <nav>
    <button onclick="goHome()">🏠 Home</button>
    <button onclick="showSearch()">🔎 Search</button>
    <button onclick="showAllTopics()">📚 Topics</button>
  </nav>
</header>

<div class="container">

<p class="intro">
Learn Senior 1, Senior 2 and Senior 3 Mathematics,
Chemistry, Physics and English.
Read notes, study topics and practise.
</p>

<div class="search-box" id="searchBox">
  <input id="searchInput"
         type="text"
         placeholder="Search subject or topic...">

  <button onclick="searchTopics()">🔎 Search</button>
</div>

<h2>🎓 Choose Your Class</h2>

<div class="class-buttons">

<button class="class-btn active"
onclick="selectClass(1,this)">
Senior 1
</button>

<button class="class-btn"
onclick="selectClass(2,this)">
Senior 2
</button>

<button class="class-btn"
onclick="selectClass(3,this)">
Senior 3
</button>

</div>

<div class="subjects">

<div class="subject" onclick="openSubject('Mathematics')">
📐 Mathematics
</div>

<div class="subject" onclick="openSubject('Physics')">
⚛️ Physics
</div>

<div class="subject" onclick="openSubject('Chemistry')">
🧪 Chemistry
</div>

<div class="subject" onclick="openSubject('English')">
📖 English
</div>

</div>

<div id="topics" class="topics"></div>

</div>

<footer>
📚 Mr-dev Learning Hub<br><br>
Senior 1 • Senior 2 • Senior 3<br><br>
Learn • Practise • Succeed
</footer>

</div>


<script>

let currentClass = 1;

const data = {

Mathematics: [
  ["Algebra",
   "Learn algebra and practise questions.",
   "Algebra is the study of numbers, symbols and rules for manipulating them.",
   "Examples include simplifying expressions and solving equations."],

  ["Fractions",
   "Study fractions and practise questions.",
   "A fraction represents part of a whole.",
   "Examples: 1/2, 3/4 and 5/8."],

  ["Linear Equations",
   "Study linear equations.",
   "A linear equation is an equation where the highest power of the variable is 1.",
   "Example: 2x + 4 = 10. Therefore x = 3."],

  ["Geometry",
   "Study shapes, angles and measurements.",
   "Geometry deals with shapes, sizes, angles and properties of space.",
   "Important topics include triangles, circles and quadrilaterals."],

  ["Statistics",
   "Study statistics and data.",
   "Statistics is the study of collecting, organising and analysing data.",
   "Mean, median and mode are important measures."]
],

Physics: [
  ["Measurement",
   "Study measurement and practise questions.",
   "Measurement is the process of finding the size or amount of something.",
   "Common quantities include length, mass, time and temperature."],

  ["Motion",
   "Study motion and practise questions.",
   "Motion is the change in position of an object with time.",
   "Speed = Distance ÷ Time."],

  ["Force",
   "Study force and practise questions.",
   "Force is a push or pull that can change the motion or shape of an object.",
   "Force is measured in Newtons (N). F = m × a."],

  ["Energy",
   "Study energy and practise questions.",
   "Energy is the ability to do work.",
   "Forms include kinetic, potential, heat, light and electrical energy."],

  ["Heat",
   "Study heat and temperature.",
   "Heat is energy transferred from a hotter object to a colder object.",
   "Temperature measures how hot or cold something is."]
],

Chemistry: [
  ["Matter",
   "Study matter and its properties.",
   "Matter is anything that has mass and occupies space.",
   "The three common states are solid, liquid and gas."],

  ["Atoms",
   "Study atoms and their structure.",
   "An atom is the smallest unit of an element that retains its chemical properties.",
   "Atoms contain protons, neutrons and electrons."],

  ["Elements",
   "Study chemical elements.",
   "An element is a pure substance made of only one type of atom.",
   "Examples include oxygen, hydrogen and carbon."]
],

English: [
  ["Grammar",
   "Study English grammar.",
   "Grammar is the set of rules used to form correct sentences.",
   "It includes nouns, verbs, adjectives and other parts of speech."],

  ["Tenses",
   "Study English tenses.",
   "Tenses show the time when an action happens.",
   "Examples are past, present and future tense."],

  ["Writing",
   "Practise English writing.",
   "Good writing requires clear ideas, correct grammar and good organisation.",
   "Always organise your introduction, body and conclusion."]
]

};


function selectClass(number,button){

  currentClass = number;

  document.querySelectorAll(".class-btn")
  .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  document.getElementById("topics").style.display="none";
}


function openSubject(subject){

  const topics = data[subject];

  const box = document.getElementById("topics");

  box.innerHTML = `
    <h2>📚 ${subject} - Senior ${currentClass}</h2>
  `;

  topics.forEach((item,index)=>{

    box.innerHTML += `
      <div class="topic"
           onclick="openNotes('${subject}',${index})">

        <h3>Topic ${index+1}: ${item[0]}</h3>

        <p>
          📘 ${item[1]}
        </p>

      </div>
    `;

  });

  box.style.display="block";

  box.scrollIntoView({
    behavior:"smooth"
  });
}


function openNotes(subject,index){

  const item = data[subject][index];

  document.getElementById("app").innerHTML = `

    <div class="notes-page">

      <button class="back" onclick="location.reload()">
        ← Back to Topics
      </button>

      <div class="notes">

        <h1>📘 ${item[0]}</h1>

        <p>
          <b>Class:</b> Senior ${currentClass}
        </p>

        <hr>

        <h2>📖 Notes</h2>

        <p>
          ${item[2]}
        </p>

        <h2>📝 Important points</h2>

        <p>
          ${item[3]}
        </p>

        <h2>🎯 Example</h2>

        <div class="formula">
          Study this topic carefully and practise
          questions related to it.
        </div>

        <h2>✅ Practice</h2>

        <p>
          Write down what you have learned about
          <b>${item[0]}</b> and practise at least
          five questions.
        </p>

      </div>

    </div>
  `;
}


function searchTopics(){

  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  if(!search){
    alert("Please enter a subject or topic.");
    return;
  }

  const results=[];

  Object.keys(data).forEach(subject=>{

    data[subject].forEach((item,index)=>{

      if(
        subject.toLowerCase().includes(search) ||
        item[0].toLowerCase().includes(search) ||
        item[1].toLowerCase().includes(search)
      ){

        results.push({
          subject:subject,
          index:index,
          name:item[0],
          description:item[1]
        });

      }

    });

  });

  const box=document.getElementById("topics");

  if(results.length===0){

    box.innerHTML=`
      <h2>❌ No results found</h2>
      <p>Try another subject or topic.</p>
    `;

  }else{

    box.innerHTML=`
      <h2>🔎 Search Results</h2>
    `;

    results.forEach(result=>{

      box.innerHTML += `

        <div class="topic"
             onclick="openNotes('${result.subject}',${result.index})">

          <h3>
            ${result.subject}: ${result.name}
          </h3>

          <p>
            📘 ${result.description}
          </p>

        </div>

      `;

    });

  }

  box.style.display="block";

  box.scrollIntoView({
    behavior:"smooth"
  });
}


function showSearch(){

  document
    .getElementById("searchBox")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function showAllTopics(){

  openSubject("Mathematics");

}


function goHome(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

</script>

</body>
</html>
