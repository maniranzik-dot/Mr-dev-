<!-- SEARCH -->
<section id="searchSection">
  <h2>🔎 Search</h2>

  <input
    id="searchInput"
    type="text"
    placeholder="Search subject or topic..."
  >

  <button id="searchBtn" type="button">
    🔎 Search
  </button>

  <div id="searchResults"></div>
</section>

<style>
#searchSection {
  width: 100%;
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
}

#searchInput {
  width: 100%;
  padding: 18px;
  box-sizing: border-box;
  border-radius: 14px;
  border: 2px solid #315b87;
  background: #102f4d;
  color: white;
  font-size: 18px;
  margin-bottom: 12px;
}

#searchInput::placeholder {
  color: #aebed1;
}

#searchBtn {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 14px;
  background: #20df72;
  color: #071426;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

#searchResults {
  margin-top: 20px;
}

.searchItem {
  background: #102f4d;
  border: 1px solid #315b87;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
  color: white;
}

.searchItem h3 {
  margin: 0 0 8px;
  color: #20df72;
}
</style>

<script>
const searchData = [
  ["Senior 1","Mathematics","Numbers"],
  ["Senior 1","Mathematics","Algebra"],
  ["Senior 1","Mathematics","Geometry"],
  ["Senior 1","Chemistry","Matter"],
  ["Senior 1","Chemistry","Elements and Compounds"],
  ["Senior 1","Chemistry","Chemical Changes"],
  ["Senior 1","Physics","Measurement"],
  ["Senior 1","Physics","Motion"],
  ["Senior 1","Physics","Energy"],
  ["Senior 1","English","Grammar"],
  ["Senior 1","English","Reading"],
  ["Senior 1","English","Writing"],

  ["Senior 2","Mathematics","Equations"],
  ["Senior 2","Mathematics","Algebra"],
  ["Senior 2","Mathematics","Geometry"],
  ["Senior 2","Mathematics","Graphs"],
  ["Senior 2","Chemistry","Atoms"],
  ["Senior 2","Chemistry","Chemical Reactions"],
  ["Senior 2","Chemistry","Acids and Bases"],
  ["Senior 2","Physics","Motion"],
  ["Senior 2","Physics","Electricity"],
  ["Senior 2","Physics","Light"],
  ["Senior 2","English","Grammar"],
  ["Senior 2","English","Comprehension"],
  ["Senior 2","English","Writing"],

  ["Senior 3","Mathematics","Algebra"],
  ["Senior 3","Mathematics","Functions"],
  ["Senior 3","Mathematics","Trigonometry"],
  ["Senior 3","Mathematics","Geometry"],
  ["Senior 3","Mathematics","Statistics and Probability"],
  ["Senior 3","Mathematics","Vectors"],
  ["Senior 3","Chemistry","Organic Chemistry"],
  ["Senior 3","Chemistry","Chemical Calculations"],
  ["Senior 3","Chemistry","Acids and Bases"],
  ["Senior 3","Chemistry","Metals"],
  ["Senior 3","Chemistry","Electrochemistry"],
  ["Senior 3","Physics","Electricity"],
  ["Senior 3","Physics","Waves"],
  ["Senior 3","Physics","Magnetism"],
  ["Senior 3","Physics","Light"],
  ["Senior 3","English","Literature"],
  ["Senior 3","English","Grammar"],
  ["Senior 3","English","Writing Skills"]
];

function doSearch() {
  const input = document.getElementById("searchInput");
  const results = document.getElementById("searchResults");

  const query = input.value.trim().toLowerCase();

  if (query === "") {
    results.innerHTML =
      "<div class='searchItem'>✏️ Andika icyo ushaka gushaka.</div>";
    return;
  }

  const found = searchData.filter(item =>
    item[0].toLowerCase().includes(query) ||
    item[1].toLowerCase().includes(query) ||
    item[2].toLowerCase().includes(query)
  );

  if (found.length === 0) {
    results.innerHTML =
      "<div class='searchItem'>❌ Nta topic yabonetse.</div>";
    return;
  }

  results.innerHTML = found.map(item => `
    <div class="searchItem">
      <h3>📚 ${item[0]}</h3>
      <div>📖 Subject: <b>${item[1]}</b></div>
      <div>📌 Topic: <b>${item[2]}</b></div>
    </div>
  `).join("");
}

document.getElementById("searchBtn").addEventListener("click", doSearch);

document.getElementById("searchInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    doSearch();
  }
});
</script>
