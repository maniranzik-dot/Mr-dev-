<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr-dev</title>

  <style>
    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    nav {
      background: #0f172a;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-size: 16px;
    }

    nav a:hover {
      color: #22c55e;
    }

    .hero {
      text-align: center;
      padding: 90px 20px;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    section {
      text-align: center;
      padding: 80px 20px;
      min-height: 300px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #0f172a;
    }
  </style>
</head>

<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="home" class="hero">
    <h1>Welcome to Mr-dev</h1>

    <p>Learn coding and build amazing websites.</p>

    <button onclick="location.href='#about'">
      Get Started
    </button>
  </section>

  <section id="about">
    <h2>About Mr-dev</h2>
    <p>We are learning how to build modern websites.</p>
  </section>

  <section id="services">
    <h2>Our Services</h2>
    <p>Website Development</p>
    <p>Web Design</p>
    <p>Coding Lessons</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: mrdev@example.com</p>
  </section>

  <footer>
    <p>© 2026 Mr-dev</p>
  </footer>

</body>
</html>
