<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr Dev Learning Hub</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>📚 Mr Dev Learning Hub</h1>

<p>Free Education Platform For Everyone</p>

</header>



<section class="dashboard">

<div class="card">

<h2>🎓 Dashboard</h2>

<button onclick="showClass('Senior One')">
Senior One
</button>

<button onclick="showClass('Senior Two')">
Senior Two
</button>

<button onclick="showClass('Senior Three')">
Senior Three
</button>

</div>



<div class="card">

<h2>🔎 Search Notes</h2>

<input id="search"
placeholder="Search notes..."
onkeyup="searchNotes()">

</div>



<div class="card">

<h2>📖 Available Notes & Books</h2>

<div id="notes">

No notes uploaded yet

</div>

</div>



<div class="card">

<h2>🤖 AI Teacher</h2>

<button class="ai" onclick="aiTeacher()">

Ask AI Teacher

</button>

</div>



<div class="card">

<h2>💬 WhatsApp Support</h2>

<button class="whatsapp" onclick="whatsapp()">

Open WhatsApp

</button>

</div>



<div class="card">

<h2>🔐 Owner Mode</h2>

<button onclick="ownerLogin()">

Login Owner

</button>


</div>



<div id="ownerPanel" class="card hidden">


<h2>👑 Owner Upload</h2>


<input id="bookTitle"
placeholder="Book or Note name">


<input id="bookURL"
placeholder="PDF link">


<button class="plus" onclick="uploadNote()">

➕ Add Note

</button>


</div>


</section>



<script src="script.js"></script>


</body>

</html>
