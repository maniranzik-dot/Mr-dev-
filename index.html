<!-- ==========================
 DASHBOARD PART 2
 ADMIN PANEL
========================== -->

<section class="admin-dashboard">

<h1>⚙️ Admin Dashboard</h1>


<div class="admin-cards">


<div class="admin-card">

<h2>📊 Statistics</h2>

<p>Total Seniors: <b>3</b></p>
<p>Total Subjects: <b>12+</b></p>
<p>Total Notes: <b>Completed</b></p>

</div>



<div class="admin-card">

<h2>➕ Add Notes</h2>

<input type="text" placeholder="Note title">

<select>

<option>Select Senior</option>
<option>Senior One</option>
<option>Senior Two</option>
<option>Senior Three</option>

</select>


<select>

<option>Select Subject</option>
<option>Mathematics</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>Science</option>

</select>


<button onclick="addNote()">
Save Note
</button>


</div>



<div class="admin-card">

<h2>📚 Manage Subjects</h2>

<ul>

<li>Mathematics</li>
<li>Physics</li>
<li>Chemistry</li>
<li>Biology</li>
<li>Science</li>

</ul>


<button>
Edit Subjects
</button>


</div>




<div class="admin-card">

<h2>👨‍🎓 Students</h2>

<p>Active Students</p>

<h1 id="students">
0
</h1>


<button onclick="increaseStudents()">
Add Student
</button>


</div>



<div class="admin-card">

<h2>👁️ Views</h2>

<p>Website Visitors</p>

<h1 id="views">
0
</h1>


<button onclick="increaseViews()">
Update Views
</button>


</div>



</div>

</section>



<style>

.admin-dashboard{

padding:30px;
background:#eef5ff;

}


.admin-cards{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}


.admin-card{

background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 12px #ccc;

}


.admin-card h2{

color:#004aad;

}


.admin-card input,
.admin-card select{

width:90%;
padding:12px;
margin:8px;

border-radius:8px;
border:1px solid #aaa;

}


.admin-card button{

background:#004aad;
color:white;

padding:12px 20px;

border:none;

border-radius:8px;

cursor:pointer;

}


</style>



<script>


let students = 0;

let views = 0;



function increaseStudents(){

students++;

document.getElementById("students")
.innerHTML = students;

}



function increaseViews(){

views++;

document.getElementById("views")
.innerHTML = views;

}



function addNote(){

alert("Note saved successfully!");

}


</script>
