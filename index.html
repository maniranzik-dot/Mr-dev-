<section>
<h2>Learning Center</h2>

<div class="card">
<h3>📘 Senior 1</h3>
<p>Learn mathematics, science, languages and basic computer skills.</p>
<button onclick="askAI('Senior 1')">Ask AI</button>
</div>

<div class="card">
<h3>📗 Senior 2</h3>
<p>Improve your knowledge with lessons and exercises.</p>
<button onclick="askAI('Senior 2')">Ask AI</button>
</div>

<div class="card">
<h3>📕 Senior 3</h3>
<p>Prepare for exams with explanations and practice.</p>
<button onclick="askAI('Senior 3')">Ask AI</button>
</div>

</section>


<section class="contact">
<h2>🤖 AI Teacher</h2>

<p id="answer">Ask me any question.</p>

<input id="question" placeholder="Write your question">

<button onclick="askAI()">Ask</button>

</section>


<script>
function askAI(level){

let q=document.getElementById("question").value;
let answer=document.getElementById("answer");

if(level){
answer.innerHTML="AI Teacher for "+level+" is ready. Ask your question.";
}
else if(q){
answer.innerHTML="AI answer: I received your question: "+q;
}
else{
answer.innerHTML="Please write a question.";
}

}
</script>
