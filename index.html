<!DOCTYPE html>
<html>
<head>

<title>Mr-dev REB Learning</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
margin:0;
background:#061426;
color:white;
}

header{
background:#0d1b32;
padding:25px;
text-align:center;
border-bottom:4px solid #20e875;
}

h1{
color:#20e875;
}

.container{
padding:20px;
}

.card{
background:#153653;
padding:20px;
margin:15px 0;
border-radius:20px;
}

button{
background:#20e875;
border:0;
padding:15px;
border-radius:15px;
font-weight:bold;
margin:5px;
cursor:pointer;
}

select{
padding:15px;
width:100%;
border-radius:15px;
font-size:18px;
}

.lesson{
background:white;
color:black;
padding:20px;
border-radius:15px;
margin-top:20px;
}

</style>

</head>


<body>


<header>

<h1>📚 Mr-dev REB Learning</h1>

<p>Senior 1 - Senior 3 Science & Mathematics</p>

</header>


<div class="container">


<div class="card">


<h2>Select Class</h2>


<select id="classSelect" onchange="loadSubjects()">

<option>Select Senior</option>

<option value="S1">Senior One</option>

<option value="S2">Senior Two</option>

<option value="S3">Senior Three</option>


</select>


</div>



<div id="subjects"></div>



<div id="content"></div>


</div>



<script>


const books={


S1:[

"Mathematics",
"Biology",
"Chemistry",
"Physics"

],


S2:[

"Mathematics",
"Biology",
"Chemistry",
"Physics"

],


S3:[

"Mathematics",
"Biology",
"Chemistry",
"Physics"

]


};



function loadSubjects(){


let cls=document.getElementById("classSelect").value;


let html="<div class='card'><h2>Select Subject</h2>";


books[cls].forEach((subject)=>{


html+=`

<button onclick="openBook('${cls}','${subject}')">

${subject}

</button>

`;

});


html+="</div>";


document.getElementById("subjects").innerHTML=html;


}



function openBook(cls,subject){


document.getElementById("content").innerHTML=`

<div class="lesson">


<h2>${cls} ${subject}</h2>


<p>

Units zose za REB zizashyirwamo hano.

</p>


<p>

Buri Unit izaba ifite:

<br>✅ Notes zuzuye

<br>✅ Explanation

<br>✅ Examples

<br>✅ Exercises

<br>✅ Answers

</p>


</div>


`;


}


</script>


</body>
</html>
