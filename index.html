<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr-dev Learning Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#071426;
  --card:#10233d;
  --card2:#172e4d;
  --text:#ffffff;
  --muted:#aebed1;
  --green:#20df72;
  --blue:#318cff;
  --danger:#ff5d6c;
  --border:#29486c;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
}

body.light{
  --bg:#f4f7fb;
  --card:#ffffff;
  --card2:#eaf1f8;
  --text:#102033;
  --muted:#526579;
  --border:#c9d7e5;
}

header{
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:var(--green);
}

nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  background:var(--green);
  color:#06130b;
}

.container{
  width:94%;
  max-width:1200px;
  margin:auto;
}

.hero{
  text-align:center;
  padding:55px 15px 35px;
}

.hero h1{
  font-size:42px;
  margin-bottom:12px;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  color:var(--muted);
  font-size:19px;
  max-width:750px;
  margin:auto;
}

.search{
  display:flex;
  gap:10px;
  max-width:800px;
  margin:30px auto;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:16px;
}

.search button{
  background:var(--green);
  color:#06130b;
  font-weight:bold;
}

.section-title{
  font-size:30px;
  margin:35px 0 18px;
}

.classes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.class-btn{
  padding:25px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  background:var(--card);
}

.class-btn.active{
  background:var(--green);
  color:#06130b;
}

.subjects{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:20px;
}

.subject{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;
  cursor:pointer;
}

.subject:hover{
  transform:translateY(-3px);
  border-color:var(--green);
}

.subject h3{
  margin-bottom:7px;
}

.subject p{
  color:var(--muted);
}

.book{
  margin-top:25px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:25px;
}

.book h2{
  color:var(--green);
  margin-bottom:15px;
}

.topic{
  border:1px solid var(--border);
  background:var(--card2);
  border-radius:12px;
  margin:10px 0;
  overflow:hidden;
}

.topic-title{
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
  font-size:17px;
  font-weight:bold;
}

.note{
  display:none;
  padding:18px;
  border-top:1px solid var(--border);
  color:var(--muted);
}

.note.show{
  display:block;
}

.note strong{
  color:var(--text);
}

.quiz{
  margin:40px 0;
  padding:25px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  margin:8px 0;
}

.score{
  margin-top:15px;
  font-weight:bold;
  color:var(--green);
}

footer{
  margin-top:50px;
  padding:30px;
  text-align:center;
  color:var(--muted);
  border-top:1px solid var(--border);
}

.hidden{
  display:none!important;
}

@media(max-width:800px){
  .header-inner{
    flex-direction:column;
  }

  nav{
    width:100%;
    justify-content:center;
  }

  .hero h1{
    font-size:32px;
  }

  .subjects{
    grid-template-columns:repeat(2,1fr);
  }

  .classes{
    grid-template-columns:1fr;
  }

  .search{
    flex-direction:column;
  }
}

@media(max-width:500px){
  .subjects{
    grid-template-columns:1fr;
  }

  .hero{
    padding-top:35px;
  }

  .hero h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header>
<div class="header-inner">

<div class="logo">
📚 <span>Mr-dev</span> Learning Hub
</div>

<nav>
<button onclick="showHome()">🏠 Home</button>
<button onclick="showBooks()">📚 Books</button>
<button onclick="showQuiz()">📝 Quiz</button>
<button onclick="toggleTheme()">🌙 Theme</button>
</nav>

</div>
</header>


<main class="container">

<section class="hero" id="home">

<h1>Welcome to <span>Mr-dev Learning Hub</span></h1>

<p>
Learn Senior 1, Senior 2 and Senior 3 Mathematics,
Chemistry, Physics and English. Read notes,
study topics and practise with quizzes.
</p>

<div class="search">
<input
id="searchInput"
placeholder="Search a topic e.g. Algebra, Electricity..."
oninput="searchTopics()">
<button onclick="searchTopics()">🔎 Search</button>
</div>

</section>


<section id="books">

<h2 class="section-title">🎓 Choose Your Class</h2>

<div class="classes">

<button class="class-btn active" onclick="loadClass(1)">
Senior 1
</button>

<button class="class-btn" onclick="loadClass(2)">
Senior 2
</button>

<button class="class-btn" onclick="loadClass(3)">
Senior 3
</button>

</div>

<div id="subjects"></div>

</section>


<section class="quiz" id="quiz">

<h2>📝 Practice Quiz</h2>

<p id="question"></p>

<div id="options"></div>

<p class="score" id="score"></p>

<button onclick="nextQuestion()">Next Question ➡️</button>

</section>

</main>


<footer>
<p>📚 Mr-dev Learning Hub</p>
<p>Study • Practise • Improve</p>
</footer>
