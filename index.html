<!DOCTYPE html>
<html>
<head>
<title>Mr-dev Quiz</title>

<style>
body{
background:#071426;
font-family:Arial;
color:white;
}

.quiz{
background:#17263d;
width:85%;
margin:40px auto;
padding:25px;
border-radius:20px;
text-align:center;
}

button{
width:90%;
padding:15px;
margin:10px;
border:none;
border-radius:25px;
background:#263954;
color:white;
font-size:16px;
}

button:hover{
background:#20d66b;
}

.next{
background:#20d66b;
}

.correct{
background:#20d66b;
}

.wrong{
background:#e63946;
}

.score{
font-size:20px;
}

</style>
</head>


<body>

<div class="quiz">

<h1>📝 Quiz Test</h1>

<h2 id="question"></h2>

<div id="answers"></div>

<p class="score" id="score">Score: 0</p>

<button class="next" onclick="next()">Next Question ➡️</button>

</div>


<script>

let data=[
{
q:"HTML ikoreshwa iki?",
a:["Gukora website","Gukina umupira"],
c:0
},
{
q:"CSS ikoreshwa iki?",
a:["Gushushanya website","Gufata amafoto"],
c:0
},
{
q:"JavaScript ikoreshwa iki?",
a:["Kongera imikorere ya website","Gukora imodoka"],
c:0
}
];


let i=0;
let score=0;


function load(){

document.getElementById("question").innerHTML=data[i].q;

let box=document.getElementById("answers");
box.innerHTML="";

data[i].a.forEach((x,n)=>{

let btn=document.createElement("button");
btn.innerHTML=x;

btn.onclick=function(){

if(n==data[i].c){

score++;
btn.className="correct";

}else{

btn.className="wrong";

}

document.getElementById("score").innerHTML=
"Score: "+score;

}

box.appendChild(btn);

});

}


function next(){

i++;

if(i>=data.length){

alert("Finished! Score: "+score);

i=0;
score=0;

}

load();

}


load();

</script>

</body>
</html>
