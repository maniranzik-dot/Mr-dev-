<!DOCTYPE html>
<html>
<head>

<title>Mr Dev Learning Hub</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f2f5f8;
margin:0;
padding:15px;
}

header{
background:#0066ff;
color:white;
padding:20px;
text-align:center;
border-radius:10px;
}

.card{
background:white;
padding:15px;
margin:15px 0;
border-radius:12px;
box-shadow:0 2px 8px #ccc;
}


button{
padding:12px;
border:none;
border-radius:8px;
background:#0066ff;
color:white;
cursor:pointer;
}


.plus{
background:green;
}


.ai{
background:#8000ff;
}


.whatsapp{
background:#25D366;
}


input,select{
width:90%;
padding:10px;
margin:5px;
}


.book{
background:#eee;
padding:10px;
margin:8px;
border-radius:8px;
}


.owner{
display:none;
}


a{
text-decoration:none;
color:white;
}

</style>

</head>


<body>


<header>

<h1>📚 Mr Dev Learning Hub</h1>

<p>Free Education Platform For Everyone</p>

</header>



<div class="card">

<h2>🟦 Senior One</h2>

<button onclick="showSubject('Senior One')">
Open Notes
</button>

</div>




<div class="card">

<h2>🟩 Senior Two</h2>

<button onclick="showSubject('Senior Two')">
Open Notes
</button>

</div>




<div class="card">

<h2>🟧 Senior Three</h2>

<button onclick="showSubject('Senior Three')">
Open Notes
</button>

</div>




<div class="card">

<h2>📖 Books And Notes</h2>

<div id="books">

No books uploaded yet

</div>

</div>




<button onclick="ownerLogin()">

🔐 Owner Mode

</button>





<div class="card owner" id="ownerPanel">


<h2>➕ Owner Upload</h2>


<input id="bookName" placeholder="Book name">


<input id="bookLink" placeholder="PDF link">


<button class="plus" onclick="addBook()">

+ Add Book

</button>


</div>





<div class="card">

<h2>🤖 AI Teacher</h2>


<button class="ai" onclick="aiTeacher()">

Ask AI Teacher

</button>


</div>






<div class="card">

<h2>💬 WhatsApp Support</h2>


<button class="whatsapp"
onclick="openWhatsapp()">

Open WhatsApp

</button>


</div>






<script>


const password="kevin@2026";



function ownerLogin(){


let pass=prompt("Enter Owner Password");


if(pass===password){


document.getElementById("ownerPanel").style.display="block";


alert("Owner Mode Activated");


}

else{

alert("Wrong Password");

}


}





function addBook(){


let name=document.getElementById("bookName").value;

let link=document.getElementById("bookLink").value;



if(name=="" || link==""){

alert("Fill book information");

return;

}



let box=document.getElementById("books");



let div=document.createElement("div");


div.className="book";


div.innerHTML=

"📘 "+name+

"<br><br>"+

"<a style='color:blue' href='"+link+"' target='_blank'>Open Book</a>";



box.appendChild(div);



}




function showSubject(className){

alert(className+" Notes will appear here.");

}




function aiTeacher(){

alert("AI Teacher: Ask questions about Mathematics, Physics, Chemistry and Biology.");

}




function openWhatsapp(){


window.open(
"https://wa.me/250738939769"
);


}



</script>


</body>

</html>
