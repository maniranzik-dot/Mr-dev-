/* =========================
   SEARCH
========================= */

function searchUnits(){

const query=document
.getElementById("search")
.value
.toLowerCase()
.trim();

if(!query){
return;
}

let results="";

Object.keys(allClasses).forEach(cls=>{

allClasses[cls].forEach(subject=>{

subject.units.forEach((unit,index)=>{

if(
unit.name.toLowerCase().includes(query) ||
subject.subject.toLowerCase().includes(query) ||
unit.notes.toLowerCase().includes(query)
){

results+=`

<div class="unit"
onclick="openUnit(
'${cls}',
${allClasses[cls].indexOf(subject)},
${index}
)">

<h3>📖 ${cls} — ${subject.subject}</h3>

<p>${unit.name}</p>

</div>

`;

}

});

});

});

if(!results){

results=`
<div class="card">
<h2>❌ No results</h2>
<p>Try searching Mathematics, Physics, Chemistry, Biology or a unit name.</p>
</div>
`;

}

document.getElementById("content").innerHTML=`

<div class="card">

<h2>🔎 Search Results</h2>

${results}

</div>

`;

}
