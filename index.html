<script>
function askAI(){

let question = document.getElementById("question").value.toLowerCase();
let answer = document.getElementById("answer");

if(question.includes("math")){
answer.innerHTML="🤖 AI: I can help you with Mathematics for Senior 1, 2 and 3.";

}
else if(question.includes("physics")){
answer.innerHTML="🤖 AI: I can explain Physics lessons.";

}
else if(question.includes("chemistry")){
answer.innerHTML="🤖 AI: I can help you understand Chemistry.";

}
else if(question.includes("english")){
answer.innerHTML="🤖 AI: I can help you learn English.";

}
else{
answer.innerHTML="🤖 AI: Your question is: " + question + ". I will help you learn.";
}

}
</script>
