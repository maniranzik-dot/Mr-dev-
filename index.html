<!DOCTYPE html>
<html>
<head>
<title>Mr-dev Learning AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  text-align:center;
}

header{
  padding:50px 20px;
}

h1{
  font-size:45px;
}

.card{
  background:#1e293b;
  margin:20px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 20px #000;
}

button{
  background:#22c55e;
  color:white;
  border:none;
  padding:15px 30px;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#16a34a;
}

input{
  width:80%;
  padding:15px;
  border-radius:20px;
  border:none;
  margin:15px;
}

#answer{
  background:#111827;
  padding:20px;
  border-radius:15px;
  margin:20px;
}
</style>

</head>

<body>

<header>
<h1>Mr-dev AI Learning</h1>
<p>Learn Senior 1, Senior 2 and Senior 3 with AI Teacher</p>
</header>


<div class="card">
<h2>📘 Senior 1</h2>
<p>Mathematics, Science, English and more</p>
<button onclick="askAI('Senior 1')">Start Learning</button>
</div>


<div class="card">
<h2>📗 Senior 2</h2>
<p>Improve your knowledge and prepare exams</p>
<button onclick="askAI('Senior 2')">Start Learning</button>
</div>


<div class="card">
<h2>📕 Senior 3</h2>
<p>Advanced lessons and exam preparation</p>
<button onclick="askAI('Senior 3')">Start Learning</button>
</div>


<div class="card">

<h2>🤖 AI Teacher</h2>

<input id="question" placeholder="Ask your question">

<br>

<button onclick="answerAI()">Ask AI</button>

<p id="answer">AI is ready to help you.</p>

</div>


<script>

function askAI(level){
document.getElementById("answer").innerHTML=
"AI Teacher: Welcome to "+level+" lessons. Ask me any question.";
}


function answerAI(){

let q=document.getElementById("question").value.toLowerCase();

let a="AI: I will help you learn.";

if(q.includes("math")){
a="AI: I can help you solve mathematics problems.";
}

else if(q.includes("physics")){
a="AI: I can explain physics lessons.";
}

else if(q.includes("chemistry")){
a="AI: I can explain chemistry.";
}

else if(q.includes("english")){
a="AI: I can help you learn English.";
}

else{
a="AI: Please ask a question about your lessons.";
}

document.getElementById("answer").innerHTML=a;

}

</script>

</body>
</html>
