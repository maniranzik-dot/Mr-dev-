<script>


function openPage(id){

let pages=document.querySelectorAll(".page");


pages.forEach(function(page){

page.classList.remove("active");

});


document.getElementById(id).classList.add("active");


}





function askAI(){

let q=document.getElementById("ask").value.toLowerCase();


let answer=
"I can help with Senior 1, Senior 2 and Senior 3 lessons.";


if(q.includes("math")){

answer=
"Mathematics: I can explain algebra, geometry and calculations.";

}


else if(q.includes("physics")){

answer=
"Physics: I can explain force, energy, electricity and motion.";

}


else if(q.includes("chemistry")){

answer=
"Chemistry: I can explain atoms, reactions, acids and bases.";

}


else if(q.includes("english")){

answer=
"English: I can help with grammar, writing and reading.";

}


document.getElementById("reply").innerHTML=
answer;


}





function dark(){

document.body.style.background="#071426";
document.body.style.color="white";

}





function light(){

document.body.style.background="white";
document.body.style.color="black";

}


</script>
