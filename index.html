<script>


function askAI(){

let q=document
.getElementById("question")
.value
.toLowerCase();


let answer="I can help with Senior 1, Senior 2 and Senior 3 lessons.";


if(q.includes("math")){

answer="Mathematics: I can explain algebra, geometry and equations.";

}


else if(q.includes("physics")){

answer="Physics: I can explain force, energy, motion and electricity.";

}


else if(q.includes("chemistry")){

answer="Chemistry: I can explain atoms, reactions, acids and bases.";

}


else if(q.includes("english")){

answer="English: I can help with grammar, writing and reading.";

}


document.getElementById("answer").innerHTML=
answer;


}

}



</script>
