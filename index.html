nav {
  background: #0f172a;
  padding: 18px 10px;
  position: sticky;
  top: 0;
  z-index: 1000;
  text-align: center;
  border-bottom: 1px solid #334155;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 12px;
  font-size: 16px;
  font-weight: bold;
  transition: 0.3s;
}

nav a:hover {
  color: #22c55e;
}
