<!DOCTYPE html>
<html>
<head>
<title>Mr Dev Learning Hub</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f2f5f8;
padding:15px;
}

header{
background:#0066ff;
color:white;
padding:20px;
text-align:center;
border-radius:12px;
}

.card{
background:white;
padding:15px;
margin:15px 0;
border-radius:12px;
box-shadow:0 3px 10px #ccc;
}

button{
background:#0066ff;
color:white;
border:none;
padding:12px;
border-radius:8px;
margin:5px;
}

.plus{
background:green;
}

.ai{
background:purple;
}

.whatsapp{
background:#25D366;
}

input{
width:90%;
padding:10px;
margin:5px;
}

.book{
background:#eee;
padding:10px;
margin:8px;
border-radius:8px;
}

#ownerPanel{
display:none;
}

</style>

</head>


<body>


<header>

<h1>📚 Mr Dev Learning Hub</h1>

<p>Free Education Platform</p>

</header>



<div class="card">

<h2>🎓 Dashboard</h2>

<button onclick="openClass('Senior One')">
Senior One
</button>

<button onclick="openClass('Senior Two')">
Senior Two
</button>

<button onclick="openClass('Senior Three')">
Senior Three
</button>

</div>



<div class="card">

<h2>📖 Notes & Books</h2>

<div id="books">

No books added yet

</div>

</div>




<div class="card">

<button onclick="ownerLogin()">
🔐 Owner Mode
</button>

</div>




<div class="card" id="ownerPanel">

<h2>👑 Owner Upload</h2>

<input id="title" placeholder="Book name">

<input id="link" placeholder="PDF link">


<button class="plus" onclick="addBook()">

➕ Add Book

</button>


</div>





<div class="card">

<h2>🤖 AI Teacher</h2>

<button class="ai" onclick="aiTeacher()">

Ask AI Teacher

</button>

</div>





<div class="card">

<h2>💬 WhatsApp</h2>

<button class="whatsapp" onclick="whatsapp()">

Open WhatsApp

</button>

</div>




<script>


const ownerPassword="kevin@2026";



function ownerLogin(){

let password=prompt("Enter Owner Password");


if(password===ownerPassword){

document.getElementById("ownerPanel").style.display="block";

alert("Owner Mode Activated");

}

else{

alert("Wrong Password");

}

}




function addBook(){

let title=document.getElementById("title").value;

let link=document.getElementById("link").value;


if(title==="" || link===""){

alert("Add book name and link");

return;

}



document.getElementById("books").innerHTML +=

`

<div class="book">

<h3>📖 ${title}</h3>

<a href="${link}" target="_blank">
Open Book
</a>

</div>

`;


}




function openClass(name){

document.getElementById("books").innerHTML=

`

<h2>${name}</h2>

<p>📘 Mathematics</p>

<p>⚡ Physics</p>

<p>🧪 Chemistry</p>

<p>🌱 Biology</p>

`;

}




function aiTeacher(){

alert("🤖 AI Teacher: Ask your question about lessons.");

}




function whatsapp(){

window.open(
"https://wa.me/250738939769",
"_blank"
);

}


</script>


</body>
</html>
