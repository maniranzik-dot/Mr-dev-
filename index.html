<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr-dev</title>

  <style>
    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    nav {
      background: #0f172a;
      padding: 20px;
      position: sticky;
      top: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 18px;
    }

    nav a:hover {
      color: #22c55e;
    }

    section {
      min-height: 100vh;
      padding: 80px 20px;
    }

    h1 {
      font-size: 50px;
    }

    p {
      font-size: 20px;
    }

    .btn {
      display: inline-block;
      background: #22c55e;
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="home">
    <h1>Welcome to Mr-dev</h1>
    <p>Learn coding and build amazing websites.</p>
    <a class="btn" href="#about">Get Started</a>
  </section>

  <section id="about">
    <h1>About Me</h1>
    <p>I am learning web development.</p>
  </section>

  <section id="services">
    <h1>My Services</h1>
    <p>Websites, coding and web design.</p>
  </section>

  <section id="contact">
    <h1>Contact</h1>
    <p>Welcome to my website!</p>
  </section>

</body>
</html>
