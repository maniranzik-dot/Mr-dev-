<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr Dev Learning Hub</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>📚 Mr Dev Learning Hub</h1>

<p>Free Education Platform For Everyone</p>

</header>




<div class="container">


<section class="card">

<h2>🎓 Dashboard</h2>


<button onclick="showClass('Senior One')">
Senior One
</button>


<button onclick="showClass('Senior Two')">
Senior Two
</button>


<button onclick="showClass('Senior Three')">
Senior Three
</button>


</section>





<section class="card">


<h2>🔎 Search Notes</h2>


<input 
type="text"
id="search"
placeholder="Search books or notes..."
onkeyup="searchNotes()">


</section>






<section class="card">


<h2>📖 Notes & Books</h2>


<div id="notes">

Loading notes...

</div>


</section>







<section class="card">


<h2>🤖 AI Teacher</h2>


<button class="ai" onclick="aiTeacher()">

Ask AI Teacher

</button>


</section>








<section class="card">


<h2>💬 WhatsApp Support</h2>


<button class="whatsapp" onclick="whatsapp()">

Open WhatsApp

</button>


</section>








<section class="card">


<h2>🔐 Owner Mode</h2>


<button onclick="ownerLogin()">

Login Owner

</button>


</section>








<section id="ownerPanel" class="card hidden">


<h2>👑 Owner Upload Panel</h2>


<input 
type="file"
id="bookFile">



<input 
type="text"
id="bookTitle"
placeholder="Book name">



<button class="plus" onclick="uploadBook()">

➕ Upload Book

</button>


</section>



</div>







<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script src="firebase-config.js"></script>

<script src="script.js"></script>



</body>

</html>
