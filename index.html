<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr-dev Learning Platform</title>

<style>
body{
font-family:Arial;
background:#071426;
color:white;
margin:0;
}

header{
background:#16c172;
padding:20px;
text-align:center;
}

section{
padding:20px;
}

.card{
background:#102d49;
padding:20px;
margin:15px;
border-radius:15px;
}

button{
background:#16c172;
border:none;
padding:12px;
border-radius:10px;
font-weight:bold;
}

input{
padding:12px;
width:90%;
border-radius:10px;
}

#chat{
background:white;
color:black;
padding:15px;
border-radius:15px;
height:300px;
overflow:auto;
}

.answer{
color:#16c172;
font-weight:bold;
}
</style>

</head>


<body>

<header>

<h1>🎓 Mr-dev Learning</h1>

<p>Senior 1 • Senior 2 • Senior 3</p>

</header>


<section>

<h2>📖 Classes</h2>


<div class="card">

<h3>Senior One</h3>

<button onclick="openClass('S1')">
Open
</button>

</div>


<div class="card">

<h3>Senior Two</h3>

<button onclick="openClass('S2')">
Open
</button>

</div>


<div class="card">

<h3>Senior Three</h3>

<button onclick="openClass('S3')">
Open
</button>

</div>


<div id="notes" class="card">

Select class to see Units

</div>


</section>



<section>

<h2>🤖 AI Teacher</h2>


<div id="chat">

AI Teacher: Muraho! Baza ikibazo cyawe.

</div>


<input id="question" placeholder="Ask AI Teacher">


<button onclick="askAI()">

Send

</button>


</section>



<section>

<h2>💬 WhatsApp</h2>

<a href="https://wa.me/250738939769">

<button>
Chat 0738939769
</button>

</a>


</section>



<script>


let units={


S1:[

"Unit 1: Mathematics Introduction",

"Unit 2: Algebra",

"Unit 3: Geometry",

"Unit 4: Biology Cells",

"Unit 5: Chemistry Matter",

"Unit 6: Physics Measurement"

],


S2:[

"Unit 1: Algebra",

"Unit 2: Statistics",

"Unit 3: Electricity",

"Unit 4: Chemical Reactions",

"Unit 5: Human Biology"

],


S3:[

"Unit 1: Trigonometry",

"Unit 2: Physics Motion",

"Unit 3: Organic Chemistry",

"Unit 4: Genetics"

]


};



function openClass(c){

let box=document.getElementById("notes");

box.innerHTML="<h3>"+c+"</h3>";

units[c].forEach(function(u){

box.innerHTML +=

"<div class='card'>📖 "+u+
"<br><br>Notes: Explanation will appear here."
+
"<br><br>Exercise: Practice questions here."
+
"</div>";

});

}



function askAI(){

let q=document.getElementById("question").value;

let chat=document.getElementById("chat");


chat.innerHTML +=

"<p><b>You:</b> "+q+"</p>";


let answer="";

if(q.toLowerCase().includes("photosynthesis")){

answer="Photosynthesis ni uburyo ibimera bikoresha urumuri gukora ibiryo.";

}

else if(q.toLowerCase().includes("math")){

answer="Nshobora kugufasha Mathematics intambwe ku yindi.";

}

else{

answer="AI Teacher: Ndakwigisha. Banza umbwire Unit cyangwa subject.";

}


chat.innerHTML +=

"<p class='answer'>"+answer+"</p>";



document.getElementById("question").value="";


}


</script>


</body>
</html>
